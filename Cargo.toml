[package]
name = "webcraft"
version = "0.4.0"
edition = "2021"
description = "Clean-room cross-platform download manager (IDM feature clone)"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
# NNTP TLS. default-features=false keeps ring provider (already via reqwest).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
url = "2"
sha2 = "0.10"
aes = "0.8"
cbc = "0.1"
directories = "5"
futures-util = "0.3"
russh = "0.64"
russh-sftp = "3"
eframe = { version = "0.29", default-features = false, features = ["glow", "wayland", "x11"] }
egui = "0.29"
rfd = "0.15"
arboard = "3"
tray-icon = "0.19"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[lib]
name = "downloadcraft_lib"
path = "src/lib.rs"

[[bin]]
name = "webcraft"
path = "src/main.rs"

[[bin]]
name = "webcraft-host"
path = "src/bin/webcraft_host.rs"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
