[package]
name = "downloadcraft"
version = "0.3.1"
edition = "2021"
description = "Clean-room cross-platform download manager (IDM feature clone)"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
url = "2"
sha2 = "0.10"
aes = "0.8"
cbc = "0.1"
directories = "5"
futures-util = "0.3"
eframe = { version = "0.29", default-features = false, features = ["glow", "wayland", "x11"] }
egui = "0.29"
rfd = "0.15"
arboard = "3"
tray-icon = "0.19"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[lib]
name = "downloadcraft_lib"
path = "src/lib.rs"

[[bin]]
name = "downloadcraft"
path = "src/main.rs"

[[bin]]
name = "downloadcraft-host"
path = "src/bin/downloadcraft_host.rs"

[profile.release]
lto = "thin"
